name: Create a (Pre)release on NuGet

# One workflow, two packages, chosen by the tag:
#   WifiManager.Maui        10.3.0, 10.3.0-beta, 10.3.0-beta1, 10.3.0-preview1
#   WifiManager.MacVendors  1.0.0-MacVendors, 1.0.0-beta-MacVendors, 1.0.0-beta1-MacVendors, 1.0.0-preview1-MacVendors
# The package version is the tag without its "-MacVendors" ending.
#
# Publishing uses NuGet trusted publishing: each job swaps a short-lived GitHub OIDC token for a
# temporary NuGet API key (NuGet/login), so no long-lived key is stored in the repository. It needs
# a trusted publishing policy on nuget.org for this repository and this workflow file, and the
# NUGET_USER secret set to the nuget.org account name (the profile name, not the email address).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta"
      - "[0-9]+.[0-9]+.[0-9]+-beta[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-preview[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-MacVendors"
      - "[0-9]+.[0-9]+.[0-9]+-beta-MacVendors"
      - "[0-9]+.[0-9]+.[0-9]+-beta[0-9]+-MacVendors"
      - "[0-9]+.[0-9]+.[0-9]+-preview[0-9]+-MacVendors"

jobs:
  release-nuget:
    if: ${{ !endsWith(github.ref_name, '-MacVendors') }}
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Verify commit exists in origin/main or origin/develop
        run: |
          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
          $branches = git branch --remote --contains
          if (-not ($branches | Select-String -Pattern 'origin/main|origin/develop')) {
            Write-Error "Tagged commit is not contained in origin/main or origin/develop"
            exit 1
          }

      - name: Get version information from tag
        id: get_version
        run: |
          "version=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore dependencies
        run: dotnet restore samples\DemoApp.csproj

      - name: Build
        run: dotnet build src\MAUIWifiManager\MauiWifiManager.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }}

      # A failing test stops the job here, so nothing is packed or pushed.
      # Same /p:Version as Build: the test build rewrites the net10.0 output that Pack (--no-build) picks up.
      - name: Run unit tests
        run: dotnet test tests\MauiWifiManager.Tests\MauiWifiManager.Tests.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }}

      - name: Pack
        run: dotnet pack src\MAUIWifiManager\MauiWifiManager.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }} --no-build --output .

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

  # WifiManager.MacVendors targets .NET Standard 2.0 with no dependencies, so it needs no MAUI
  # workload and builds on Linux.
  release-macvendors:
    if: ${{ endsWith(github.ref_name, '-MacVendors') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 10.0.x

      - name: Verify commit exists in origin/main or origin/develop
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git branch --remote --contains HEAD | grep -qE 'origin/(main|develop)$'; then
            echo "::error::Tagged commit is not contained in origin/main or origin/develop"
            exit 1
          fi

      - name: Get version information from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME%-MacVendors}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build src/WifiManager.MacVendors/WifiManager.MacVendors.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }}

      # A failing test stops the job here, so nothing is packed or pushed.
      # Same /p:Version as Build, so the test build does not overwrite the output Pack picks up.
      - name: Run unit tests
        run: dotnet test tests/WifiManager.MacVendors.Tests/WifiManager.MacVendors.Tests.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }}

      - name: Pack
        run: dotnet pack src/WifiManager.MacVendors/WifiManager.MacVendors.csproj -c Release /p:Version=${{ steps.get_version.outputs.version }} --no-build --output .

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
